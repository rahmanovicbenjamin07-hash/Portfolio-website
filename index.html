<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title, description, canonical, robots and Open Graph / Twitter share tags: src/seo/Seo.tsx,
         written in here at build time by scripts/prerender.mjs. -->
    <!--app-head-->

    <!-- Favicon matching the browser theme: white-fav (white circle, dark BR) in light mode, dark-fav
         (black circle, white BR) in dark mode. Files in public/images are cached for a year (_headers):
         give a replaced icon a new file name. -->
    <link rel="icon" href="/images/white-fav.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/images/dark-fav.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0B0B0C" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
